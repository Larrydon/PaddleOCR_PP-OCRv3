# 參考來自[ch_PP-OCRv3_rec_distillation.yml]

Global:
  debug: False
  use_gpu: True
  epoch_num: 500
  log_smooth_window: 20
  print_batch_step: 20

  save_model_dir: ./output/rec_plate_ctc/
  save_epoch_step: 50

  eval_batch_step: [0, 200]
  cal_metric_during_train: True

  pretrained_model: ./pretrained/best_accuracy
  checkpoints:

  save_inference_dir: ./inference/PP-OCRv3_plate_ctc/
  use_visualdl: False
  infer_img: doc/imgs_words/ch/word_1.jpg

  character_dict_path: ./ppocr/utils/dict/dict_taiwan_car.txt
  max_text_length: 10        # 🚩 車牌專用
  use_space_char: False

  infer_mode: False
  distributed: False
  save_res_path: ./output/rec/predicts_plate_ctc.txt


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    
    # >學習率排程 Cosine / Piecewise 則一使用<---
    #>----------- Cosine 餘弦衰減-平滑曲線-------
    name: Cosine
    learning_rate: 0.001   # 使用初始學習率
    #<------------------------------------------
    #>----------- Piecewise 分段衰減-階梯式------
    #name: Piecewise
    #decay_epochs : [700]
    #values : [0.0005, 0.00005]
    #<------------------------------------------

    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: CRNN

  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 2]

  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 96

  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/
    label_file_list:
      - ./train_data/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false

      - RecAug:
          use_tia: True
          aug_prob: 0.8

      - CTCLabelEncode:
          max_text_length: 8

      - RecResizeImg:
          image_shape: [3, 48, 192]
          infer_mode: False
          padding: True

      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: False
    num_workers: 8
    use_shared_memory: True

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list:
      - ./train_data/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false

      - CTCLabelEncode:
          max_text_length: 8

      - RecResizeImg:
          image_shape: [3, 48, 192]
          infer_mode: False
          padding: True

      - KeepKeys:
          keep_keys:
            - image
            - label
            - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 4
    num_workers: 0

